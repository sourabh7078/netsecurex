# NetSecureX - Nginx reverse proxy config
#
# Nginx sits in front of gunicorn and is the only thing directly exposed to
# the internet (gunicorn stays bound to 127.0.0.1, unreachable from outside).
#
# INSTALL:
#   1. Replace "yourdomain.com" below with your actual domain (a free/cheap
#      subdomain works fine -- you need SOME domain for Let's Encrypt to
#      issue a certificate against).
#   2. Copy this file to /etc/nginx/sites-available/netsecurex
#   3. sudo ln -s /etc/nginx/sites-available/netsecurex /etc/nginx/sites-enabled/
#   4. sudo nginx -t          # test the config for syntax errors
#   5. sudo systemctl restart nginx
#   6. Get free HTTPS (this AUTOMATICALLY edits this file to add the SSL
#      server block and an HTTP->HTTPS redirect -- you don't need to write
#      that part by hand):
#        sudo apt install certbot python3-certbot-nginx -y
#        sudo certbot --nginx -d yourdomain.com
#
# After certbot runs, set NSX_SESSION_COOKIE_SECURE=true in your .env file
# (see netsecurex.service) and restart the netsecurex service, since the
# session cookie will now only be sent over the HTTPS connection Nginx is
# terminating here.

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com;

    # Cap request body size -- generous enough for the docx report download
    # response and any form submissions, without leaving it unbounded.
    client_max_body_size 5M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Scans can take a while on larger CIDR ranges -- avoid Nginx
        # timing out the connection before gunicorn responds.
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    # Serve static assets directly through Nginx rather than proxying them
    # to gunicorn -- faster, and reduces load on the single worker process.
    location /static/ {
        alias /opt/netsecurex/static/;
        expires 7d;
        access_log off;
    }
}
