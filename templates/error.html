{% extends "base.html" %}
{% block title %}Error {{ code }} - NetSecureX{% endblock %}
{% block content %}
<div class="panel" style="text-align:center; max-width:520px; margin:80px auto;">
  <h1 style="font-size:3em; margin-bottom:0;">{{ code }}</h1>
  <p class="empty-state">{{ message }}</p>
  <a href="{{ url_for('dashboard') if session.logged_in else url_for('login') }}" class="btn-inline">
    Back to {{ 'Dashboard' if session.logged_in else 'Login' }}
  </a>
</div>
{% endblock %}
